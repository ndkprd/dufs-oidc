# Dev-only Keycloak for the dufs OIDC integration test. Not for production.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Issuer follows the request Host, so http://localhost:8080 works from host and browser.
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KC_PORT:-8080}:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
